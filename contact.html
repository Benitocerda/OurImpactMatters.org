<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us - Our Impact Matters</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="contact.css">
  <link rel="stylesheet" href="mobile.css" media="only screen and (max-width: 768px)">
  <link rel="stylesheet" href="contact.mobile.css" media="only screen and (max-width: 768px)">
  <!-- reCAPTCHA v3 -->
  <script src="https://www.google.com/recaptcha/api.js?render=6LcDKpUrAAAAAOhUUGvaBRhjGCx1XDLeYTZIU1Tq"></script>
</head>

<body>
<header>
  <a href="index.html" class="logo-container">
    <img src="OIM_logo.png" alt="Our Impact Matters Logo">
    <span class="logo-text">Our Impact Matters</span>
  </a>

  <div class="nav-toggle" onclick="toggleNav(this)">
    <span></span>
    <span></span>
    <span></span>
  </div>

  <nav class="main-nav">
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="board.html">Our Board</a></li>
      <li><a href="contact.html">Contact Us</a></li>
      <li>
        <a href="https://buy.stripe.com/8x28wPaOpbbK46LaVs2VG09" class="donate-header-button" target="_blank" rel="noopener noreferrer">
          Donate
        </a>
      </li>
    </ul>
  </nav>
</header>

<div class="container">
  <div class="contact-section">
    <form class="contact-form" id="contactForm" action="https://formspree.io/f/xyzjygve" method="POST">
      <h2>Contact Us</h2>

      <div class="form-group">
        <input type="text" id="name" name="name" placeholder=" " required />
        <label for="name">Full Name</label>
      </div>

      <div class="form-group">
        <input type="email" id="email" name="email" placeholder=" " required />
        <label for="email">Email</label>
      </div>

      <div class="form-group">
        <textarea id="message" name="message" placeholder=" " rows="5" maxlength="300" required></textarea>
        <label for="message">Message</label>
        <div class="char-count"><span id="charCount">0</span>/300</div>
      </div>

      <!-- Hidden reCAPTCHA token field -->
      <input type="hidden" id="recaptchaToken" name="g-recaptcha-response" />

      <button type="submit">
        Send Message <span class="spinner" id="spinner"></span>
      </button>

      <p class="privacy-note">🔒 We respect your privacy. Your information will not be shared.</p>
      <p class="success-message" id="successMsg">Thank you! We’ll get back to you in 1–2 business days.</p>
    </form>
  </div>
</div>

<footer>
  &copy; 2025 Our Impact Matters | Together We Can Change the World ❤️
</footer>

<script>
  function toggleNav(toggle) {
    toggle.classList.toggle("open");
    document.querySelector(".nav-links").classList.toggle("show");
  }

  const msgInput = document.getElementById('message');
  const countSpan = document.getElementById('charCount');
  msgInput.addEventListener('input', () => {
    countSpan.textContent = msgInput.value.length;
  });

  const form = document.getElementById('contactForm');
  const spinner = document.getElementById('spinner');
  const successMsg = document.getElementById('successMsg');

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    spinner.style.display = 'inline-block';

    grecaptcha.ready(function() {
      grecaptcha.execute('6LcDKpUrAAAAAOhUUGvaBRhjGCx1XDLeYTZIU1Tq', {action: 'submit'}).then(function(token) {
        document.getElementById('recaptchaToken').value = token;

        const formData = new FormData(form);

        fetch(form.action, {
          method: 'POST',
          body: formData,
          headers: { Accept: 'application/json' }
        }).then(res => {
          spinner.style.display = 'none';
          if (res.ok) {
            successMsg.style.display = 'block';
            form.reset();
            countSpan.textContent = 0;
          } else {
            successMsg.textContent = 'Oops! Something went wrong.';
            successMsg.style.display = 'block';
          }
        });
      });
    });
  });
</script>

</body>
</html>
