<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You for Your Donation!</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f4fdf7;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      height: 100vh;
      color: #2f855a;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      color: #2f855a;
    }

    p {
      font-size: 1.2rem;
      max-width: 600px;
      margin: 0 auto 2rem;
      color: #444;
    }

    a.button {
      background-color: #5cbf7b;
      color: white;
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      font-weight: 600;
      border-radius: 8px;
      transition: background-color 0.3s ease;
    }

    a.button:hover {
      background-color: #48a96b;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2rem;
      }

      p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <h1>🎉 Thank You!</h1>
  <p>Your donation helps us provide food, mentorship, and opportunity to communities that need it most. We are grateful for your support!</p>
  <a href="index.html" class="button">← Return to Homepage</a>
</body>
</html>
